<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search ON LOT for pins, apparel, jewelry, and handmade goods from lot vendors.">
    <title>Search — ON LOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo-wordmark" aria-label="ON LOT home"><img src="./assets/logo.jpg"
                    alt="ON LOT"></a>

            <nav class="primary-nav" aria-label="Main">
                <a href="index.html#what-is-on-lot">what is on lot?</a>
                <a href="events.html">events</a>
                <a href="creator-spotlight.html">creator spotlight</a>
                <a href="vendor-info.html">vendor info</a>
                <a href="shop.html">shop</a>
            </nav>

            <div class="header-actions">
                <form class="search-form" role="search" action="search.html" method="get">
                    <label class="search-form-field" for="header-search">
                        <span class="search-form-icon" aria-hidden="true">
                            <img src="./assets/magnifying-glass.svg" alt="" width="18" height="18">
                        </span>
                        <input id="header-search" type="search" name="q" placeholder="search">
                    </label>
                </form>

                <a href="cart.html" class="icon-button" aria-label="Shopping cart">
                    <img src="./assets/cart-shopping.svg" alt="" width="28" height="24">
                </a>

                <a href="signup.html" class="text-link">Create an Account</a>
                <a href="login.html" class="btn btn-filled-sm">Log In</a>
            </div>
        </div>
    </header>

    <main id="main" class="search-page">
        <h1 class="search-page-title" data-search-query-label>Search</h1>

        <form class="shop-search-form" role="search" action="search.html" data-typesense-search-form>
            <label class="shop-search-field" for="main-search">
                <span class="shop-search-icon" aria-hidden="true">
                    <img src="./assets/magnifying-glass.svg" alt="" width="20" height="20">
                </span>
                <input id="main-search" type="search" name="q" placeholder="search" data-typesense-search-input>
            </label>
        </form>

        <p class="search-status" data-search-status>Enter a search term above.</p>

        <div class="product-grid search-results-grid" data-search-results></div>
    </main>

    <footer class="site-footer">
        <div class="footer-watermark" aria-hidden="true">ON LOT</div>
        <div class="footer-inner">
            <div class="footer-social">
                <a href="#" aria-label="Facebook">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.253h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z" />
                    </svg>
                </a>
                <a href="#" aria-label="Instagram">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.75" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                    </svg>
                </a>
                <a href="#" aria-label="TikTok">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z" />
                    </svg>
                </a>
            </div>

            <div class="footer-content">
                <p class="footer-tagline">everything but the balloons</p>
                <nav class="footer-nav" aria-label="Footer">
                    <a href="index.html#what-is-on-lot">what is on lot?</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="events.html">events</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="creator-spotlight.html">creator spotlight</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="vendor-info.html">vendor info</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="shop.html">shop</a>
                </nav>
                <p class="footer-meta">
                    <span>&copy; 2026 ON LOT</span>
                    <span aria-hidden="true">&middot;</span>
                    <a href="contact.html">Contact</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="faqs.html">FAQs</a>
                </p>
            </div>
        </div>
    </footer>

    <script src="config/typesense.public.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typesense@2/dist/typesense.min.js"></script>
    <script src="js/search.js"></script>
</body>

</html>
